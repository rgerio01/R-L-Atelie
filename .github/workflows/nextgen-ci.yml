# Workflow de CI da Atelie da Luci PDV
name: nextgen-ci

on:
  push:
    branches: [ main, develop, homolog, "release/**", "hotfix/**" ]
  pull_request:
    branches: [ main, develop, homolog ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile tools
        run: |
          python -m py_compile \
            apps/tools/security_secret_scan.py \
            apps/tools/final_execution_parity_engine.py \
            apps/tools/auto_management_engine.py \
            apps/tools/release_gate.py \
            apps/tools/generate_release_manifest.py \
            apps/updater/release_updater.py
      - name: Secret scan
        run: |
          python apps/tools/security_secret_scan.py
      - name: Readiness gate
        run: |
          python apps/tools/final_execution_parity_engine.py
          python apps/tools/auto_management_engine.py
          python apps/tools/release_gate.py || true
          echo "Readiness is recorded here; release publication is blocked in nextgen-release when gate fails."

  package-windows:
    needs: validate
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path apps,release,Projeto_Novo_Atelie_2026.md -DestinationPath dist/atelie-nextgen-windows-${{ github.ref_name }}.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/*

  package-linux:
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Linux appliance package
        run: |
          mkdir -p dist
          tar -czf dist/atelie-nextgen-kiosk-package-${GITHUB_REF_NAME}.tar.gz apps release ../Atelie_Linux 2>/dev/null || tar -czf dist/atelie-nextgen-kiosk-package-${GITHUB_REF_NAME}.tar.gz apps release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/*
